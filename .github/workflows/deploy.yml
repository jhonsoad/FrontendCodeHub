name: Continuous Integration & Deploy

on:
  push:
    branches: ['main']

jobs:
  integration-test:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint

      - name: Run Jest tests
        run: npm run test -- --ci

  deploy:
    name: Build and Deploy to S3
    needs: integration-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Inject Environment Variables
        env:
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          API_URL: ${{ vars.API_URL }}
        run: |
          if [ -n "$GOOGLE_CLIENT_ID" ]; then
            echo "Injetando GOOGLE_CLIENT_ID no environment..."
            sed -i "s|googleClientId: '[^']*'|googleClientId: '$GOOGLE_CLIENT_ID'|g" src/environments/environment.production.ts
            sed -i "s|googleClientId: '[^']*'|googleClientId: '$GOOGLE_CLIENT_ID'|g" src/environments/environment.ts
          else
            echo "Aviso: GOOGLE_CLIENT_ID não encontrado nas variáveis/secrets do GitHub."
          fi
          if [ -n "$API_URL" ]; then
            echo "Injetando API_URL no environment..."
            sed -i "s|apiUrl: '[^']*'|apiUrl: '$API_URL'|g" src/environments/environment.production.ts
            sed -i "s|apiUrl: '[^']*'|apiUrl: '$API_URL'|g" src/environments/environment.ts
          fi

      - name: Build Project
        run: npm run build -- --configuration production

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy to AWS S3
        run: aws s3 sync dist/frontend-skills-showcase/browser s3://${{ vars.AWS_S3_BUCKET }} --delete

      - name: Invalidate CloudFront Cache
        run: aws cloudfront create-invalidation --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
